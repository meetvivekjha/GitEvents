name: Events
on:
  pull_request:
    types:
      - opened
jobs:
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: 18
      - name: install dependency
        run: npm ci
      - name: build project
        run: npm run build
      - name: Deploy
        run: echo "Deploying..."
